  <script>
    // Registered separately from Flutter's own service worker (scoped to
    // /push/ so it never controls page navigation/caching) purely to host
    // Web Push subscriptions and show notifications. The public VAPID key is
    // not secret -- it's sent to every browser that subscribes anyway.
    window.werklyVapidPublicKey =
      'BN-D2VNVVkm7fiw9L6dSJrxAdaTh6kWLuAMKIPC_VGqhi2NSLrs_iBZpQdN6-MPmZ5kAvpFLHw7-wAggW7-xvHM';

    if ('serviceWorker' in navigator && 'PushManager' in window) {
      navigator.serviceWorker.register('push/push-sw.js', { scope: '/push/' })
        .catch((error) => console.warn('Push service worker registration failed', error));
    }

    function werklyUrlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
      return outputArray;
    }

    // Returns { endpoint, p256dh, auth } on success, or { error: 'unsupported' | 'denied' }.
    window.werklySubscribePush = async function () {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        return { error: 'unsupported' };
      }
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') return { error: 'denied' };
      const registration = await navigator.serviceWorker.register('push/push-sw.js', { scope: '/push/' });
      await navigator.serviceWorker.ready;
      const existing = await registration.pushManager.getSubscription();
      const subscription = existing || await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: werklyUrlBase64ToUint8Array(window.werklyVapidPublicKey),
      });
      const json = subscription.toJSON();
      return { endpoint: json.endpoint, p256dh: json.keys.p256dh, auth: json.keys.auth };
    };

    // Returns { endpoint } of the subscription that was removed, or { endpoint: null }.
    window.werklyUnsubscribePush = async function () {
      if (!('serviceWorker' in navigator)) return { endpoint: null };
      const registration = await navigator.serviceWorker.getRegistration('/push/');
      if (!registration) return { endpoint: null };
      const subscription = await registration.pushManager.getSubscription();
      if (!subscription) return { endpoint: null };
      const endpoint = subscription.endpoint;
      await subscription.unsubscribe();
      return { endpoint };
    };

    // Returns { subscribed: boolean } without prompting for permission.
    window.werklyPushStatus = async function () {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        return { subscribed: false };
      }
      const registration = await navigator.serviceWorker.getRegistration('/push/');
      if (!registration) return { subscribed: false };
      const subscription = await registration.pushManager.getSubscription();
      return { subscribed: subscription != null };
    };
  </script>
